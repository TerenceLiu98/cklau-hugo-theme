<style>
  :root {
    color-scheme: light;
    --theme-bg: #fff;
    --theme-body-color: #444;
    --theme-heading-color: #222;
    --theme-link-color: #444;
    --theme-link-visited-color: #8b6fcb;
    --theme-muted-color: #777;
    --theme-subtle-color: #8e8d8d;
    --theme-border-color: #ececec;
    --theme-border-hover-color: #d0d0d0;
    --theme-code-bg: #f2f2f2;
    --theme-code-block-bg: #f0f0f0;
    --theme-code-color: #222;
    --theme-blockquote-border: #999;
    --theme-blockquote-color: #222;
    --theme-card-bg: #fff;
    --theme-card-shadow: rgba(0, 0, 0, 0.04);
    --theme-color-light: #f5f5f5;
    --theme-hl1-color: #666;
    --theme-toggle-bg: #f4f4f4;
    --theme-toggle-bg-hover: #e9e9e9;
    --theme-toggle-border: #d7d7d7;
    --theme-toggle-icon: #444;
    --theme-input-bg: #fff;
    --theme-tag-blue: #2a5a9e;
    --theme-tag-blue-bg: #eaf1fb;
    --theme-tag-publication: #0a7a3b;
    --theme-tag-publication-bg: #e3f7eb;
    --theme-tag-working: #b5560a;
    --theme-tag-working-bg: #fff0dc;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --theme-bg: #1f2023;
    --theme-body-color: #d7d7d7;
    --theme-heading-color: #f1f1f1;
    --theme-link-color: #d7d7d7;
    --theme-link-visited-color: #c7a7ff;
    --theme-muted-color: #ababab;
    --theme-subtle-color: #aaa;
    --theme-border-color: #3b3d42;
    --theme-border-hover-color: #555963;
    --theme-code-bg: #303238;
    --theme-code-block-bg: #282a30;
    --theme-code-color: #e4e4e4;
    --theme-blockquote-border: #686c75;
    --theme-blockquote-color: #d0d0d0;
    --theme-card-bg: #26282d;
    --theme-card-shadow: rgba(0, 0, 0, 0.22);
    --theme-color-light: #303238;
    --theme-hl1-color: #b9c0cc;
    --theme-toggle-bg: #2a2c31;
    --theme-toggle-bg-hover: #343740;
    --theme-toggle-border: #555963;
    --theme-toggle-icon: #f0d787;
    --theme-input-bg: #25262a;
    --theme-tag-blue: #9ecbff;
    --theme-tag-blue-bg: #1f334d;
    --theme-tag-publication: #8de5ad;
    --theme-tag-publication-bg: #183726;
    --theme-tag-working: #ffc179;
    --theme-tag-working-bg: #3b2c1c;
  }

  body {
    font-family: "ET Book", Palatino, "Palatino Linotype", "Palatino LT STD", "Book Antiqua", Georgia, "GenYoMinTC", "Noto Serif SC", serif;
    font-weight: 500;
    font-style: normal;
    margin: auto;
    padding: 20px;
    max-width: 980px;
    text-align: left;
    background-color: var(--theme-bg);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--theme-body-color);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  strong,
  b {
    color: var(--theme-heading-color);
  }

  a {
    color: var(--theme-link-color);
    text-decoration: none;
    /*color: #ff5e6c;*/
  }

  .title {
    text-decoration: none;
    border: 0;
  }

  .title span {
    font-weight: 400;
  }

  nav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0 10px;
  }

  nav a {
    margin-right: 0;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    margin-left: 2px;
    padding: 0;
    color: var(--theme-toggle-icon);
    background: var(--theme-toggle-bg);
    border: 1px solid var(--theme-toggle-border);
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .theme-toggle:hover {
    background: var(--theme-toggle-bg-hover);
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--theme-link-color);
    outline-offset: 2px;
  }

  .theme-toggle__icon {
    width: 1rem;
    height: 1rem;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  html[data-theme="light"] .theme-toggle__icon--sun,
  html[data-theme="dark"] .theme-toggle__icon--moon {
    display: none;
  }

  textarea {
    width: 100%;
    font-size: 16px;
  }

  textarea,
  input {
    background-color: var(--theme-input-bg);
    color: var(--theme-body-color);
  }

  input {
    font-size: 16px;
  }

  content {
    line-height: 1.6;
  }

  main content p a {
    word-wrap: break-word;
    border: none;
    box-shadow: inset 0 -2px var(--theme-link-color);
    transition-property: box-shadow;
    transition-duration: .1s;
  }

  table {
    width: 100%;
  }

  img {
    max-width: 100%;
  }

  code {
    padding: 2px 5px;
    background-color: var(--theme-code-bg);
  }

  pre code {
    color: var(--theme-code-color);
    display: block;
    padding: 20px;
    white-space: pre-wrap;
    font-size: 14px;
    overflow-x: auto;
  }

  div.highlight pre {
    background-color: initial;
    color: initial;
  }

  div.highlight code {
    background-color: unset;
    color: unset;
  }

  blockquote {
    border-left: 1px solid var(--theme-blockquote-border);
    color: var(--theme-blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px;
    text-align: center;
  }

  .helptext {
    color: var(--theme-muted-color);
    font-size: small;
  }

  .errorlist {
    color: #eba613;
    font-size: small;
  }

  /* blog posts */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
    line-height: 2;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 6.5rem;
  }

  ul.blog-posts li time {
    color: var(--theme-subtle-color);
  }

  ul.blog-posts li a:visited {
    color: var(--theme-link-visited-color);
  }

/* * Margin notes/sidenotes */
.sidenote {
    font-size: 80%;        /* slightly smaller font for sidenote content */
    font-weight: normal;
    color: var(--theme-hl1-color);
    position: relative;    /* forces note to be relative its the normal position */
}
/* Wide viewport */
@media (min-width: 1400px) {
    .sidenote {
        float: right;
        clear: right;           /* prevent overlapping of sidenotes */
        text-align: left;

        /* https://kennethfriedman.org/thoughts/2019/marginal-notes/ */
        /* display: inline; */  /* not sure if this is required */
        top: -3rem;            /* start the sidenote display a bit higher than its reference in body */
        width: 20vw;           /* limits the width of the marginal note */
        margin-right: -23vw;    /* sets the distance of sidenote's left margin from the HTML element on right */
        margin-top: 1rem;      /* keep some space between adjacent sidenotes if they get too close */
    }
}
/* Narrow viewport */
/* Interleave the "sidenotes" with the body text on narrow screen */
@media (max-width: 1400px) {
    .sidenote {
        /* As the sidenotes are in the body in narrow viewport, they need to
           be floated to the left. */
        float: right;
        text-align: left;

        /* display: block; */  /* not sure if this is required */
        width: 100%; /* Width is set to 100% so that the sidenote when inlined takes up the entire row. */
        margin: 1rem 0;
        padding-left: 5%; /* Indentation of the sidenotes inside the body. */
    }
}
/* Sidenote counter */
/* https://codepen.io/dredmorbius/details/OVmBaZ */
body {
    counter-reset: sidenote-counter;
}
.sidenote-number {
    counter-increment: sidenote-counter;
}
/* Counter before the sidenote in the margin. */
.sidenote::before {
    content: "\2020";
    position: relative;
    vertical-align: super;
    font-size: 0.9em;
    font-weight: bold;
}
/* Counter in the main body. */
.sidenote-number::after {
    content: "\2020";
    position: relative;
    vertical-align: super;
    font-size: 0.7em;
    font-weight: bold;
    color: var(--theme-body-color);
    display: inline;
    margin-right: 0.2rem;
}
@media (min-width: 1400px) {
    /* Highlight the sidenote when mouse hovers on the sidenote number in body. */
    .sidenote-number:hover .sidenote {
        background-color: var(--theme-color-light);
    }
}

/* Card styles - for friends */ 
.card-container {
    display: flex;
    flex-direction: column;
    align-items: center; /* Centers the cards horizontally */
    gap: 5px; /* Space between each card */
    padding: 5px;
}

.card {
    width: 80%; /* Adjust based on preference */
    box-shadow: 0 0px 0px var(--theme-card-shadow); /* Soft shadow around each card */
    display: flex;
    align-items: center; /* Aligns the image and text content */
    padding: 10px;
    background: var(--theme-card-bg); /* Card background */
    text-decoration: none; /* Removes underline from links */
    color: inherit; /* Inherits text color from parent */
}

.card img {
    width: 80px; /* Fixed size for all images */
    height: 80px;
    border-radius: 50%; /* Circular images */
    margin-right: 20px; /* Space between image and text */
}

.card .info h2 {
    margin: 0;
    font-size: 1.2em; /* Adjust based on preference */
}

.card .info p {
    margin: 5px 0 0; /* Space from title to description */
    font-size: 0.9em;
    color: var(--theme-body-color); /* Lighter text color for the description */
}
.card .info span{
    font-size: 0.5em;
    color: var(--theme-hl1-color);
}


.research-card {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 14px;
  margin: 6px 0;
  border: 1px solid var(--theme-border-color);
  border-radius: 8px;
  background-color: var(--theme-card-bg);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.research-card:hover {
  border-color: var(--theme-border-hover-color);
  box-shadow: 0 2px 8px var(--theme-card-shadow);
}

.research-card__index {
  flex: 0 0 auto;
  font-size: 13px;
  color: var(--theme-subtle-color);
  min-width: 18px;
  text-align: right;
  align-self: flex-start;
  padding-top: 2px;
}

.research-card__body {
  flex: 1 1 auto;
  min-width: 0;
}

.research-card__meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 3px;
}

.research-card__tag {
  display: inline-block;
  padding: 1px 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  border-radius: 10px;
  line-height: 1.6;
}
.research-card__tag--publication {
  color: var(--theme-tag-publication);
  background-color: var(--theme-tag-publication-bg);
}
.research-card__tag--working {
  color: var(--theme-tag-working);
  background-color: var(--theme-tag-working-bg);
}

.research-card__venue {
  font-size: 12.5px;
  color: var(--theme-muted-color);
}

.research-card__title {
  margin: 0 0 4px 0;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--theme-heading-color);
}

.research-card__authors {
  margin: 0 0 6px 0;
  font-size: 13px;
  color: var(--theme-body-color);
}

.research-card__links {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.research-card__links a {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.6;
  color: var(--theme-body-color);
  background-color: var(--theme-code-bg);
  border: 1px solid transparent;
  border-radius: 12px;
  text-decoration: none;
  transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.research-card__links a:hover {
  color: var(--theme-bg);
  background-color: var(--theme-body-color);
  border-color: var(--theme-body-color);
  text-decoration: none;
}

.research-card__links a.research-card__links--post {
  color: var(--theme-tag-blue);
  background-color: var(--theme-tag-blue-bg);
}
.research-card__links a.research-card__links--post:hover {
  color: var(--theme-bg);
  background-color: var(--theme-tag-blue);
  border-color: var(--theme-tag-blue);
}

.research-card__image {
  flex: 0 0 auto;
  width: 320px;
  height: 200px;
  overflow: hidden;
  border-radius: 6px;
  background: var(--theme-color-light);
}

.research-card__image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

@media (max-width: 640px) {
  .research-card {
    align-items: flex-start;
  }
  .research-card__image {
    width: 140px;
    height: 90px;
  }
}


.post-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 18px 0;
}
.post-tags--cloud {
  margin-top: 24px;
}

.post-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.6;
  color: var(--theme-tag-blue);
  background-color: var(--theme-tag-blue-bg);
  border: 1px solid transparent;
