{{- if or (eq .Params.comment true) (eq .Params.comments true) -}}
{{- $c := .Site.Params.comments -}}
{{- with $c -}}

{{- with .utteranc -}}
{{- if .enable -}}
<section class="comments" id="comments">
  <script src="https://utteranc.es/client.js"
          repo="{{ .repo }}"
          issue-term="{{ .issueTerm | default "pathname" }}"
          {{ with .label }}label="{{ . }}"{{ end }}
          theme="{{ .theme | default "github-light" }}"
          crossorigin="anonymous"
          async>
  </script>
</section>
{{- end -}}
{{- end -}}

{{- with .giscus -}}
{{- if .enable -}}
<section class="comments" id="comments">
  <script src="https://giscus.app/client.js"
          data-repo="{{ .repo }}"
          data-repo-id="{{ .repo_id }}"
          data-category="{{ .category }}"
          data-category-id="{{ .category_id }}"
          data-mapping="{{ .mapping | default "pathname" }}"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="{{ .position | default "bottom" }}"
          data-theme="{{ .theme | default "preferred_color_scheme" }}"
          data-lang="{{ .lang | default "en" }}"
          data-loading="{{ .loading | default "lazy" }}"
          crossorigin="anonymous"
          async>
  </script>
</section>
{{- end -}}
{{- end -}}

{{- end -}}
{{- end -}}
